syntax = "proto3";

package inventory;

import "google/api/annotations.proto";

option go_package = "github.com/djgupt/remote-inventory";


// Session management and video streaming service
service InventoryService {
  // Create a new session for a provider
  rpc CreateSession(CreateSessionRequest) returns (SessionResponse) {
    option (google.api.http) = {
      post: "/v1/sessions"
      body: "*"
    };
  }

  // List all active sessions (for consumers to discover providers)
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse) {
    option (google.api.http) = {
      get: "/v1/sessions"
    };
  }

  // End a session
  rpc EndSession(EndSessionRequest) returns (EndSessionResponse) {
    option (google.api.http) = {
      delete: "/v1/sessions/{session_id}"
    };
  }

  // WebRTC Signaling
  rpc SendWebRTCSignal(WebRTCSignal) returns (SignalResponse) {
    option (google.api.http) = {
      post: "/v1/webrtc/signal"
      body: "*"
    };
  }

  rpc WatchWebRTCSignals(WatchSignalsRequest) returns (stream WebRTCSignal) {}

  // Provider streams video to Backend
  rpc ProviderStream(stream ProviderMessage) returns (stream ProviderCommand);
  
  // Consumer receives privacy-blurred video and sends commands
  rpc ConsumerStream(stream ConsumerCommand) returns (stream VideoFrame);
  
  // Heartbeat to keep session alive
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse) {
    option (google.api.http) = {
      post: "/v1/sessions/{session_id}/heartbeat"
      body: "*"
    };
  }

  // Connection Request Flow (v1.3.0)
  rpc RequestConnection(RequestConnectionRequest) returns (RequestConnectionResponse) {
    option (google.api.http) = {
      post: "/v1/sessions/{session_id}/connect"
      body: "*"
    };
  }

  rpc ApproveConnection(ApproveConnectionRequest) returns (ApproveConnectionResponse) {
    option (google.api.http) = {
      post: "/v1/requests/{request_id}/approve"
      body: "*"
    };
  }

  rpc DenyConnection(DenyConnectionRequest) returns (DenyConnectionResponse) {
    option (google.api.http) = {
      post: "/v1/requests/{request_id}/deny"
      body: "*"
    };
  }

  rpc WatchConnectionRequests(WatchConnectionRequestsRequest) returns (stream ConnectionRequestNotification) {
    option (google.api.http) = {
      get: "/v1/sessions/{session_id}/requests/watch"
    };
  }

  rpc WatchApprovalStatus(WatchApprovalStatusRequest) returns (stream ApprovalStatusUpdate) {
    option (google.api.http) = {
      get: "/v1/requests/{request_id}/status"
    };
  }
}

// Session messages
message CreateSessionRequest {
  string provider_id = 1;
  string provider_name = 2;
  string location = 3;  // Provider location/address (deprecated)
  double latitude = 4;  // GPS latitude for geocoding
  double longitude = 5; // GPS longitude for geocoding
}

message JoinSessionRequest {
  string session_id = 1;
  string consumer_id = 2;
  string consumer_name = 3;
}

message SessionResponse {
  string session_id = 1;
  string token = 2;
  bool success = 3;
  string message = 4;
}

message EndSessionRequest {
  string session_id = 1;
  string token = 2;
}

message EndSessionResponse {
  bool success = 1;
}

// Provider messages
message ProviderMessage {
  string session_id = 1;
  string token = 2;
  oneof payload {
    VideoFrame video_frame = 3;
    SensorData sensor_data = 4;
    ProviderStatus status = 5;
  }
}

message VideoFrame {
  bytes frame_data = 1;  // JPEG encoded frame
  int64 timestamp_ms = 2;
  int32 width = 3;
  int32 height = 4;
  bool is_blurred = 5;  // Indicates if privacy processing is complete
}

message SensorData {
  float accelerometer_x = 1;
  float accelerometer_y = 2;
  float accelerometer_z = 3;
  float compass_heading = 4;
  float gyroscope_x = 5;
  float gyroscope_y = 6;
  float gyroscope_z = 7;
}

message ProviderStatus {
  bool camera_active = 1;
  int32 battery_level = 2;
}

// Provider receives commands from Consumer
message ProviderCommand {
  oneof command {
    NavigationCommand navigation = 1;
    LaserCommand laser = 2;
    StopCommand stop = 3;
    ZoomCommand zoom = 4;
  }
}

message NavigationCommand {
  enum Direction {
    UNKNOWN = 0;
    LEFT = 1;
    RIGHT = 2;
    UP = 3;
    DOWN = 4;
    FORWARD = 5;
    BACKWARD = 6;
  }
  Direction direction = 1;
  float intensity = 2;  // 0.0 to 1.0
}

message LaserCommand {
  bool active = 1;
  float screen_x = 2;  // Normalized 0.0 to 1.0
  float screen_y = 3;  // Normalized 0.0 to 1.0
}

message StopCommand {
  bool emergency = 1;
}

message ZoomCommand {
  enum ZoomType {
    IN = 0;
    OUT = 1;
    RESET = 2;
  }
  ZoomType type = 1;
  float level = 2;  // Current zoom level
}

// Consumer messages
message ConsumerCommand {
  string session_id = 1;
  string token = 2;
  oneof command {
    NavigationCommand navigation = 3;
    LaserCommand laser = 4;
    StopCommand stop = 5;
    ZoomCommand zoom = 6;
    VoiceCommand voice = 7;
    TextCommand text = 8;
  }
}

message VoiceCommand {
  string transcribed_text = 1;
  float confidence = 2;
}

message TextCommand {
  string text = 1;
}

// Heartbeat
message HeartbeatRequest {
  string session_id = 1;
  string token = 2;
  string role = 3;  // "provider" or "consumer"
}

message HeartbeatResponse {
  bool success = 1;
}

// Connection Request Messages (v1.3.0)

message RequestConnectionRequest {
  string session_id = 1;
  string consumer_id = 2;
  string consumer_name = 3;
}

message RequestConnectionResponse {
  string request_id = 1;
}

message ApproveConnectionRequest {
  string request_id = 1;
}

message ApproveConnectionResponse {
  string session_id = 1;
  string token = 2; // WebRTC signaling token
}

message DenyConnectionRequest {
  string request_id = 1;
  string reason = 2;
}

message DenyConnectionResponse {
  bool success = 1;
}

message WatchConnectionRequestsRequest {
  string session_id = 1;
}

message ConnectionRequestNotification {
  string request_id = 1;
  string consumer_id = 2;
  string consumer_name = 3;
  int64 timestamp = 4;
}

message WatchApprovalStatusRequest {
  string request_id = 1;
}

enum ApprovalStatus {
  PENDING = 0;
  APPROVED = 1;
  DENIED = 2;
}

message ApprovalStatusUpdate {
  ApprovalStatus status = 1;
  string session_id = 2;
  string token = 3;
  string message = 4;
}

// Session Discovery Messages
message ListSessionsRequest {
  string search_query = 1;
}

message ListSessionsResponse {
  repeated SessionInfo sessions = 1;
}

message SessionInfo {
  string session_id = 1;
  string provider_name = 2;
  string location = 3;  // Deprecated, use formatted_address
  string formatted_address = 4; // Geocoded address (e.g., "San Francisco, CA")
  double latitude = 5;   // GPS latitude
  double longitude = 6;  // GPS longitude
  bool in_active_call = 7;  // True if provider is currently in a call
  int64 created_at = 8;
  bool accepting_connections = 9;
}

// Command Messages
message Command {
  string session_id = 1;
  oneof command_type {
    NavigationCommand navigation = 2;
    LaserCommand laser = 3;
    StopCommand stop = 4;
    ZoomCommand zoom = 5;
    VoiceCommand voice = 6;
    TextCommand text = 7;
  }
}

message CommandResponse {
  bool success = 1;
  string message = 2;
}

// ============================================================
// WEBRTC SIGNALING MESSAGES
// ============================================================

message WebRTCSignal {
  string session_id = 1;
  string from_device_id = 2;
  string to_device_id = 3;
  SignalType type = 4;
  string payload = 5;  // JSON-encoded SDP or ICE candidate
  
  enum SignalType {
    OFFER = 0;
    ANSWER = 1;
    ICE_CANDIDATE = 2;
  }
}

message SignalResponse {
  bool success = 1;
  string message = 2;
}

message WatchSignalsRequest {
  string session_id = 1;
  string device_id = 2;  // Device watching for signals
}
